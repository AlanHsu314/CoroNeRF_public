benchmark:
  name: paper_ne_representation_V2
  base_config: ../config_coronerf.yaml
  output_dir: ../../runs_benchmarks/paper_ne_representation_V2

  history_plots:
    enabled: True
    select_by: final/ne_shell_low_corona/shell_mean_abs_dlog_mean
    select_mode: min
    band_name: low_corona
    out_subdir: history_plots
    include:
      - train_loss
      - image_mse
      - image_logmse
      - image_psnr
      - ne_mean_abs_dlog
      - ne_mean_abs_frac
      - temp_mean_abs_dlog
      - temp_mean_abs_frac

  fixed:
    mode: train
    verbosity: 1
    wandb.enabled: True
    wandb.mode: offline
    io.no_save: False
    use_dummy_dir: False
    device: cuda

    dataset_dir: ../../datasets/master_datasets_res/res256__seed-12648430__eb4c3af3

    renderer.renderer_model: uniform
    renderer.step_size: 0.00390625

    train.batch_rays: 1024
    train.max_steps: 30000
    train.log_every: 100
    train.checkpoint_every: 3000
    train.render_every: 3000
    train.loss_curve_every: 3000
    train.shell_debug_every: 3000

    eval.enable_inline: True
    eval.eval_every: 3000
    eval.chunk_size: 8192
    eval.log_eps: 1.0e-12
    eval.shell_radii: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.6, 3.0, 3.5, 4.0]
    eval.shell_metric_bands.low_corona: [1.1, 1.5]
    eval.shell_metric_bands.inner: [1.1, 2.0]
    eval.shell_metric_bands.mid: [1.1, 2.6]
    eval.shell_metric_bands.full: [null, null]

    load_data_kwargs.train_type: subset
    load_data_kwargs.train_num_views: 300
    load_data_kwargs.train_subset_strategy: evenly_spaced
    load_data_kwargs.train_subset_offset: 0

    load_data_kwargs.holdout_type: fixed_count
    load_data_kwargs.holdout_num_views: 30
    load_data_kwargs.holdout_subset_strategy: evenly_spaced
    load_data_kwargs.holdout_subset_offset: 1

  seeds: [0xC0FFEE, 0xC0FFEF, 0xC0FFF0]

  experiments:
    - name: mlp_baseline
      overrides:
        reconstruction.target: ne
        model.name: density_mlp
        model.dtype: float
        model.strict_types: True

        DensityMLP_kwargs.hidden_dim: 256
        DensityMLP_kwargs.num_hidden: 4
        DensityMLP_kwargs.L: 6
        DensityMLP_kwargs.in_dim: 3
        DensityMLP_kwargs.use_sh_encoding: True
        DensityMLP_kwargs.sh_degree: 2

    - name: hashgrid_l17
      overrides:
        reconstruction.target: ne
        model.name: plasma_hash_field
        model.dtype: float
        model.strict_types: True

        PlasmaField_kwargs.backend: torch
        PlasmaField_kwargs.backend_fallback: True
        PlasmaField_kwargs.in_dim: 3
        PlasmaField_kwargs.n_levels: 17
        PlasmaField_kwargs.n_features_per_level: 2
        PlasmaField_kwargs.log2_hashmap_size: 20
        PlasmaField_kwargs.base_resolution: 16
        PlasmaField_kwargs.finest_resolution: 512
        PlasmaField_kwargs.shared_hidden_dim: 64
        PlasmaField_kwargs.shared_num_hidden: 0
        PlasmaField_kwargs.head_hidden_dim: 64
        PlasmaField_kwargs.head_num_hidden: 2
        PlasmaField_kwargs.use_raw_xyz: False
        PlasmaField_kwargs.use_sh_encoding: False
        PlasmaField_kwargs.sh_degree: 2

        train.lambda_ne: 0.0
        train.lambda_temp: 0.0

    - name: hashgrid_l19
      overrides:
        reconstruction.target: ne
        model.name: plasma_hash_field
        model.dtype: float
        model.strict_types: True

        PlasmaField_kwargs.backend: torch
        PlasmaField_kwargs.backend_fallback: True
        PlasmaField_kwargs.in_dim: 3
        PlasmaField_kwargs.n_levels: 19
        PlasmaField_kwargs.n_features_per_level: 2
        PlasmaField_kwargs.log2_hashmap_size: 20
        PlasmaField_kwargs.base_resolution: 16
        PlasmaField_kwargs.finest_resolution: 512
        PlasmaField_kwargs.shared_hidden_dim: 64
        PlasmaField_kwargs.shared_num_hidden: 0
        PlasmaField_kwargs.head_hidden_dim: 64
        PlasmaField_kwargs.head_num_hidden: 2
        PlasmaField_kwargs.use_raw_xyz: False
        PlasmaField_kwargs.use_sh_encoding: False
        PlasmaField_kwargs.sh_degree: 2

        train.lambda_ne: 0.0
        train.lambda_temp: 0.0

    - name: hashgrid_l20
      overrides:
        reconstruction.target: ne
        model.name: plasma_hash_field
        model.dtype: float
        model.strict_types: True

        PlasmaField_kwargs.backend: torch
        PlasmaField_kwargs.backend_fallback: True
        PlasmaField_kwargs.in_dim: 3
        PlasmaField_kwargs.n_levels: 20
        PlasmaField_kwargs.n_features_per_level: 2
        PlasmaField_kwargs.log2_hashmap_size: 20
        PlasmaField_kwargs.base_resolution: 16
        PlasmaField_kwargs.finest_resolution: 512
        PlasmaField_kwargs.shared_hidden_dim: 64
        PlasmaField_kwargs.shared_num_hidden: 0
        PlasmaField_kwargs.head_hidden_dim: 64
        PlasmaField_kwargs.head_num_hidden: 2
        PlasmaField_kwargs.use_raw_xyz: False
        PlasmaField_kwargs.use_sh_encoding: False
        PlasmaField_kwargs.sh_degree: 2

        train.lambda_ne: 0.0
        train.lambda_temp: 0.0