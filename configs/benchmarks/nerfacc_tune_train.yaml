benchmark:
  name: nerfacc_tune_train
  base_config: ../config_coronerf.yaml
  output_dir: ../../runs_benchmarks/nerfacc_tune_train

  fixed:
    mode: train
    verbosity: 1
    wandb.enabled: True
    wandb.mode: offline
    io.no_save: False
    use_dummy_dir: False
    device: cuda

    model.name: density_mlp
    DensityMLP_kwargs.hidden_dim: 256
    DensityMLP_kwargs.num_hidden: 4

    dataset_dir: ../../datasets/master_datasets_res/res256__seed-12648430__eb4c3af3

    train.batch_rays: 2048
    train.max_steps: 3000
    train.log_every: 100
    train.checkpoint_every: 1000
    train.render_every: 1000
    train.loss_curve_every: 1000
    train.shell_debug_every: 1000
    train.occ_update_every: 16

    eval.enable_inline: True
    eval.eval_every: 1000

    load_data_kwargs.train_type: subset
    load_data_kwargs.train_num_views: 300
    load_data_kwargs.train_subset_strategy: evenly_spaced
    load_data_kwargs.train_subset_offset: 0
    load_data_kwargs.holdout_type: fixed_count
    load_data_kwargs.holdout_num_views: 30
    load_data_kwargs.holdout_subset_strategy: evenly_spaced
    load_data_kwargs.holdout_subset_offset: 1

    renderer.renderer_model: nerfacc
    renderer.step_size: 0.001953125   # 1 / 512
    renderer.enable_min_samples_fallback: True
    renderer.min_samples_per_ray: 500

  seeds: [0xC0FFEE]

  experiments:
    - name: current_bad
      overrides:
        renderer.occ_res: 128
        renderer.occ_eval_fn_ne_mid: 7.25
        renderer.occ_eval_fn_ne_width: 0.25
        renderer.occ_alpha: 1.5
        renderer.fallback_when_samples: 8

    - name: fallback32
      overrides:
        renderer.occ_res: 128
        renderer.occ_eval_fn_ne_mid: 7.25
        renderer.occ_eval_fn_ne_width: 0.25
        renderer.occ_alpha: 1.5
        renderer.fallback_when_samples: 32

    - name: broader_occ
      overrides:
        renderer.occ_res: 128
        renderer.occ_eval_fn_ne_mid: 7.25
        renderer.occ_eval_fn_ne_width: 0.5
        renderer.occ_alpha: 1.0
        renderer.fallback_when_samples: 32

    - name: broader_occ_res256
      overrides:
        renderer.occ_res: 256
        renderer.occ_eval_fn_ne_mid: 7.25
        renderer.occ_eval_fn_ne_width: 0.5
        renderer.occ_alpha: 1.0
        renderer.fallback_when_samples: 32