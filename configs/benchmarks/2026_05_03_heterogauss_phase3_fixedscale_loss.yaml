benchmark:
  name: 2026_05_03__heterogauss_phase3_fixedscale_loss
  base_config: ../config_coronerf.yaml
  output_dir: ../../runs_benchmarks/2026_05_03__heterogauss_phase3_fixedscale_loss

  history_plots:
    enabled: True
    select_by: final/temp_shell_inner/shell_mean_abs_dlog_mean
    select_mode: min
    band_name: inner
    out_subdir: history_plots
    include:
      - train_loss
      - image_mse
      - image_logmse
      - image_psnr
      - ne_mean_abs_dlog
      - ne_mean_abs_frac
      - temp_mean_abs_dlog
      - temp_mean_abs_frac

  post_condition_compare:
    enabled: true
    reference_experiment: clean
    max_conditions_per_experiment: 1
    select_by: final/temp_shell_inner/shell_mean_abs_dlog_mean
    select_mode: min
    out_subdir: condition_compare
    device: cuda

    train_panels:
      enabled: true
      num_views: 5
      strategy: evenly_spaced
      chunk_size: 8192
      eps: 1.0e-12

    test_panels:
      enabled: true
      num_views: 5
      strategy: evenly_spaced
      chunk_size: 8192
      eps: 1.0e-12
      use_reference_prediction: true

    shell_compare:
      enabled: true
      quantities: [ne, temp]
      metric_key: mean_abs_dlog

    scatter:
      enabled: true
      quantities: [ne, temp]
      max_points_per_shell: 5000
      seed: 0

  fixed:
    mode: train
    verbosity: 1
    wandb.enabled: true
    wandb.mode: offline
    io.no_save: false
    use_dummy_dir: false
    device: cuda

    dataset_dir: ../../datasets/master_datasets_multiline/res256__seed-12648430__eb4c3af3
    LUT_dir: ../data/LUT/v2

    reconstruction.target: ne_t

    renderer.renderer_model: uniform
    renderer.step_size: 0.00390625

    train.batch_rays: 1024
    train.max_steps: 60000
    train.log_every: 100
    train.checkpoint_every: 10000
    train.render_every: 10000
    train.loss_curve_every: 10000
    train.shell_debug_every: 10000
    train.shell_debug_radii: [1.2, 1.5, 2.0]

    train.image_loss.name: hetero_gaussian_asinh
    train.image_loss.lambda_gauss: 1.0
    train.image_loss.lambda_asinh: 1.0
    train.image_loss.use_huber_asinh: false
    train.image_loss.huber_delta: 0.05
    train.image_loss.asinh_scale_mode: fixed
    train.image_loss.asinh_scale_by_channel: [1.3e-2, 4.5e-4, 1.0e-2, 5.8e-2] # median SNR, noise-model agnostic

    eval.enable_inline: True
    eval.eval_every: 10000
    eval.chunk_size: 8192
    eval.log_eps: 1.0e-12
    eval.shell_radii: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.8, 2.0, 2.2, 2.4, 2.6, 3.0, 3.5, 4.0]
    eval.shell_metric_bands.low_corona: [1.1, 1.5]
    eval.shell_metric_bands.inner: [1.1, 2.0]
    eval.shell_metric_bands.mid: [1.1, 2.6]
    eval.shell_metric_bands.full: [null, null]

    load_data_kwargs.train_type: subset
    load_data_kwargs.train_num_views: 300
    load_data_kwargs.train_subset_strategy: evenly_spaced
    load_data_kwargs.train_subset_offset: 0

    load_data_kwargs.holdout_type: fixed_count
    load_data_kwargs.holdout_num_views: 30
    load_data_kwargs.holdout_subset_strategy: evenly_spaced
    load_data_kwargs.holdout_subset_offset: 1

    load_data_kwargs.channel_indices: [0, 1, 2, 3]

    model.name: plasma_hash_field
    model.dtype: float
    model.strict_types: True
    model.test_model: False

    observation_noise.enabled: true
    observation_noise.apply_to: train
    observation_noise.model: hetero_gaussian
    observation_noise.seed_offset: 0xFACADE

    observation_noise.diagnostics.enabled: True
    observation_noise.diagnostics.positive_eps: 1.0e-12
    observation_noise.diagnostics.percentiles: [10.0, 50.0, 90.0]
    observation_noise.diagnostics.max_quantile_samples: 200000
    observation_noise.diagnostics.radial_bins:
      - name: low_corona
        r_min: 1.01
        r_max: 1.5
      - name: inner
        r_min: 1.01
        r_max: 2.0
      - name: mid_outer_inner
        r_min: 1.5
        r_max: 2.0
      - name: full
        r_min: 1.01
        r_max: 3.0

    observation_noise.hetero_gaussian.shot_coeff_by_global_channel: [0.01, 0.0005, 0.01, 0.05]
    observation_noise.hetero_gaussian.sigma_floor_by_global_channel: [0.0, 0.0, 0.0, 0.0]

  seeds: [0xC0FFEE]

  experiments:
    # baseline, no observational noise, fixed asinh
    - name: clean
      overrides:
        observation_noise.enabled: false
        train.image_loss.lambda_gauss: 0.0
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: fixed
    # no gauss
    - name: sigma_g0
      overrides:
        train.image_loss.lambda_gauss: 0.0
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: target_sigma
    # 1e-5 gauss
    - name: sigma_g1em5
      overrides:
        train.image_loss.lambda_gauss: 1.0e-5
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: target_sigma
    # 1e-3 gauss
    - name: sigma_g1em3
      overrides:
        train.image_loss.lambda_gauss: 1.0e-3
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: target_sigma
    # no gauss, fixed asinh
    - name: fixed_g0
      overrides:
        train.image_loss.lambda_gauss: 0.0
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: fixed
    # 1e-5 gauss, fixed asinh
    - name: fixed_g1em5
      overrides:
        train.image_loss.lambda_gauss: 1.0e-5
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: fixed
    # 1e-3 gauss, fixed asinh
    - name: fixed_g1em3
      overrides:
        train.image_loss.lambda_gauss: 1.0e-3
        train.image_loss.lambda_asinh: 1.0
        train.image_loss.asinh_scale_mode: fixed