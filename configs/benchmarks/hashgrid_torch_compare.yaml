benchmark:
  name: hashgrid_torch_compare
  base_config: ../config_coronerf.yaml
  output_dir: ../../runs_benchmarks/hashgrid_torch_compare

  fixed:
    mode: train
    verbosity: 1
    wandb.enabled: True
    wandb.mode: offline
    io.no_save: False
    use_dummy_dir: False
    device: cuda

    dataset_dir: ../../datasets/master_datasets_res/res256__seed-12648430__eb4c3af3

    renderer.renderer_model: uniform
    renderer.step_size: 0.00390625

    train.batch_rays: 1024
    train.max_steps: 30000
    train.log_every: 100
    train.checkpoint_every: 3000
    train.render_every: 3000
    train.loss_curve_every: 3000
    train.shell_debug_every: 3000

    eval.enable_inline: True
    eval.eval_every: 3000

    load_data_kwargs.train_type: subset
    load_data_kwargs.train_num_views: 300
    load_data_kwargs.train_subset_strategy: evenly_spaced
    load_data_kwargs.train_subset_offset: 0

    load_data_kwargs.holdout_type: fixed_count
    load_data_kwargs.holdout_num_views: 30
    load_data_kwargs.holdout_subset_strategy: evenly_spaced
    load_data_kwargs.holdout_subset_offset: 1

  seeds: [0xC0FFEE, 0xC0FFEF]

  experiments:
    - name: mlp_baseline
      overrides:
        model.name: density_mlp
        model.dtype: float
        model.strict_types: True

        DensityMLP_kwargs.hidden_dim: 256
        DensityMLP_kwargs.num_hidden: 4
        DensityMLP_kwargs.L: 6
        DensityMLP_kwargs.in_dim: 3
        DensityMLP_kwargs.use_sh_encoding: True
        DensityMLP_kwargs.sh_degree: 2

    - name: hashgrid_main
      overrides:
        model.name: density_hash_mlp
        model.dtype: float
        model.strict_types: True

        DensityHashMLP_kwargs.backend: torch
        DensityHashMLP_kwargs.backend_fallback: True
        DensityHashMLP_kwargs.in_dim: 3
        DensityHashMLP_kwargs.n_levels: 16
        DensityHashMLP_kwargs.n_features_per_level: 2
        DensityHashMLP_kwargs.log2_hashmap_size: 19
        DensityHashMLP_kwargs.base_resolution: 16
        DensityHashMLP_kwargs.finest_resolution: 512
        DensityHashMLP_kwargs.decoder_hidden_dim: 64
        DensityHashMLP_kwargs.decoder_num_hidden: 2
        DensityHashMLP_kwargs.use_raw_xyz: False
        DensityHashMLP_kwargs.use_sh_encoding: False
        DensityHashMLP_kwargs.sh_degree: 2
        DensityHashMLP_kwargs.strict_types: True

    - name: hashgrid_smalltable
      overrides:
        model.name: density_hash_mlp
        model.dtype: float
        model.strict_types: True

        DensityHashMLP_kwargs.backend: torch
        DensityHashMLP_kwargs.backend_fallback: True
        DensityHashMLP_kwargs.in_dim: 3
        DensityHashMLP_kwargs.n_levels: 16
        DensityHashMLP_kwargs.n_features_per_level: 2
        DensityHashMLP_kwargs.log2_hashmap_size: 17
        DensityHashMLP_kwargs.base_resolution: 16
        DensityHashMLP_kwargs.finest_resolution: 512
        DensityHashMLP_kwargs.decoder_hidden_dim: 64
        DensityHashMLP_kwargs.decoder_num_hidden: 2
        DensityHashMLP_kwargs.use_raw_xyz: False
        DensityHashMLP_kwargs.use_sh_encoding: False
        DensityHashMLP_kwargs.sh_degree: 2
        DensityHashMLP_kwargs.strict_types: True

    - name: hashgrid_bigtable
      overrides:
        model.name: density_hash_mlp
        model.dtype: float
        model.strict_types: True

        DensityHashMLP_kwargs.backend: torch
        DensityHashMLP_kwargs.backend_fallback: True
        DensityHashMLP_kwargs.in_dim: 3
        DensityHashMLP_kwargs.n_levels: 16
        DensityHashMLP_kwargs.n_features_per_level: 2
        DensityHashMLP_kwargs.log2_hashmap_size: 20
        DensityHashMLP_kwargs.base_resolution: 16
        DensityHashMLP_kwargs.finest_resolution: 512
        DensityHashMLP_kwargs.decoder_hidden_dim: 64
        DensityHashMLP_kwargs.decoder_num_hidden: 2
        DensityHashMLP_kwargs.use_raw_xyz: False
        DensityHashMLP_kwargs.use_sh_encoding: False
        DensityHashMLP_kwargs.sh_degree: 2
        DensityHashMLP_kwargs.strict_types: True