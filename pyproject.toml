[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coronerf"
version = "0.1.0"
description = "CoroNeRF: differentiable multi-line neural coronal tomography"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["coronerf*"]